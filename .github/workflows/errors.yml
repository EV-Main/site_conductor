    outputs:
      prepare_seconds: ${{ steps.run.outputs['frontend-css-check_prepare_seconds'] }}
      seconds: ${{ steps.run.outputs['frontend-css-check_seconds'] }}
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = true
            extra-substituters = https://valeratrades.cachix.org
            extra-trusted-public-keys = valeratrades.cachix.org-1:gXVwhzO5YB+BaiEJYT48qZgzdaErGQew6xtZcz4Fo1Q=
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: ev-invest
      - id: eval-cache
        name: Restore nix eval cache
        uses: actions/cache/restore@v5
        with:
          key: nix-eval2-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          path: ~/.cache/nix
      - id: particle-cache-0
        name: Restore particle's cache
        uses: actions/cache/restore@v5
        with:
          key: particles-errors-frontend-css-check-0-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm
          restore-keys: particles-errors-frontend-css-check-0-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - id: run
        run: nix run .#test -- --severity errors frontend-css-check
      - if: always() && github.ref_name == github.event.repository.default_branch && steps.particle-cache-0.outputs.cache-hit != 'true'
        name: Save particle's cache
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.particle-cache-0.outputs.cache-primary-key }}
          path: ~/.npm
      - env:
          FAMILY: particles-errors-frontend-css-check-0-${{ runner.os }}-
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.particle-cache-0.outputs.cache-primary-key }}
        if: always() && github.ref_name == github.event.repository.default_branch && steps.particle-cache-0.outputs.cache-hit != 'true'
        name: Drop particle's older caches
        run: gh cache list -R "$GITHUB_REPOSITORY" -L 100 --key "$FAMILY" --json id,key -q 'if any(.[]; .key == $ENV.KEY) then .[] | select(.key != $ENV.KEY) | .id else empty end' | xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY"
