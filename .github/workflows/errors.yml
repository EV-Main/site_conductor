env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_DEV_STRIP: debuginfo
  RUSTC_WRAPPER: ""
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: short
