# Generated by v_flakes `github.visualBaselines`. Refresh the baselines from a run's render:
#
#   rm -f frontend/tests/__screenshots__/**/*.png
#   gh run download <run-id> -n visual-snapshots -D frontend/tests/__screenshots__
jobs:
  render:
    name: render baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: ./.github/actions/nix-env
      - continue-on-error: true
        id: gate
        name: Gate
        run: nix develop --command nix run .#test
      - name: Render
        run: |
          find frontend/tests/__screenshots__ -name '*.png' -delete
          nix develop --command nix run .#accept-test
      - if: always()
        name: Upload
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: visual-snapshots
          path: frontend/tests/__screenshots__/**/*.png
          retention-days: 14
      - if: steps.gate.outcome == 'failure'
        name: Fail on the gate
        run: |
          echo "::error::test failed: the baselines under frontend/tests/__screenshots__ don't match the render; refresh them from this run's visual-snapshots"
          exit 1
name: Visual baselines
on:
  pull_request:
    paths:
      - frontend/**
      - flake.nix
      - flake.lock
      - .github/workflows/visual-baselines.yml
  workflow_dispatch: {}
permissions:
  contents: read
